[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amazonhelp_rag_agent"
version = "0.1.0"
description = "Production Customer Support RAG Agent with Guardrails"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.103.0",
    "uvicorn>=0.23.2",
    "pydantic>=2.4.2",
    "pydantic-settings>=2.0.3",
    "scikit-learn>=1.3.0",
    "rank_bm25>=0.2.2",
    "sentence-transformers>=2.2.2",
    "faiss-cpu>=1.7.4",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "joblib>=1.3.2",
    "structlog>=23.1.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
]
